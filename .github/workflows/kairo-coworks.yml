name: Co-Works de Kairo

# El reloj que despierta a Kairo.
#
# Vercel también trae uno (kairo/vercel.json), pero en el plan gratuito
# solo suena UNA VEZ AL DÍA, y eso solo sirve para los encargos de
# primera hora. Este suena cada hora, es gratis y es el que hace que un
# Co-Work puesto a las 21:00 salga de verdad a las 21:00.
#
# Que suenen los dos no es un problema: el que llega segundo se encuentra
# el trabajo cogido (lo impide la base de datos, no el código) y se va
# sin hacer nada ni cobrar nada.
#
# Hacen falta dos secretos en GitHub → Settings → Secrets and variables
# → Actions:
#   KAIRO_URL           https://tu-web.vercel.app   (sin barra al final)
#   KAIRO_CRON_SECRET   el mismo valor que CRON_SECRET en Vercel

on:
  schedule:
    # A y cinco de cada hora. No en punto: a esa hora el planificador de
    # GitHub va cargadísimo y los avisos se retrasan.
    - cron: "5 * * * *"
  # Y un botón para lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Si un aviso tarda, que no se amontonen dos llamadas a la vez.
concurrency:
  group: kairo-coworks
  cancel-in-progress: false

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a Kairo
        env:
          KAIRO_URL: ${{ secrets.KAIRO_URL }}
          KAIRO_CRON_SECRET: ${{ secrets.KAIRO_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KAIRO_URL}" ] || [ -z "${KAIRO_CRON_SECRET}" ]; then
            echo "Faltan los secretos KAIRO_URL o KAIRO_CRON_SECRET."
            echo "GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          # LA DIRECCIÓN, PUESTA DERECHA ANTES DE USARLA.
          #
          # Las dos formas de equivocarse al pegarla acaban en lo mismo:
          # un 308 ("esto está en otro sitio") que no se parece en nada a
          # "te falta el https://". Sin esto, el que lo monta se queda
          # mirando un número que no significa nada para él.
          #
          #   · sin esquema  → curl lo intenta por http y Vercel manda a
          #                    https con un 308
          #   · con barra al final → la dirección queda con // en medio
          KAIRO_URL="${KAIRO_URL#http://}"
          KAIRO_URL="${KAIRO_URL#https://}"
          # Las barras del final, todas: a veces se pega más de una.
          while [ "${KAIRO_URL%/}" != "${KAIRO_URL}" ]; do
            KAIRO_URL="${KAIRO_URL%/}"
          done
          KAIRO_URL="https://${KAIRO_URL}"
          echo "Llamando a ${KAIRO_URL}/api/coworks/ejecutar"

          # Y la contraseña, sin lo que sobra alrededor. Un salto de línea
          # al final de la caja donde se pega no se ve, pero viaja, y
          # entonces no coincide con la de Vercel. Eso se lee igual que
          # "la has escrito mal" y no tiene nada que ver.
          SECRETO="$(printf '%s' "${KAIRO_CRON_SECRET}" | tr -d '[:space:]')"

          if [ -z "${SECRETO}" ]; then
            echo "::error::El secreto KAIRO_CRON_SECRET esta en blanco (o solo tiene espacios)."
            exit 1
          fi

          # LA Ñ, LOS ACENTOS Y LA Ç.
          #
          # Vercel mete CRON_SECRET en una cabecera HTTP para su propio
          # reloj, y una cabecera HTTP solo admite ASCII. Si la contraseña
          # lleva ñ, tilde o ç, Vercel NO CONSTRUYE la web: el despliegue
          # sale en Error y el servidor se queda con la contraseña vieja.
          #
          # Visto desde aquí eso es un 401 eterno, que se lee como "la has
          # escrito mal" y no tiene nada que ver. Así que se dice aquí,
          # antes de llamar, sin enseñar la contraseña.
          if printf '%s' "${SECRETO}" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::La contrasena tiene una letra que no es ASCII: una n con virgulilla, un acento o una c con rabito."
            echo "::error::Vercel la mete en una cabecera HTTP y se niega a construir la web con esas letras, asi que el servidor sigue con la contrasena vieja."
            echo "::error::Pon en Vercel (CRON_SECRET) y aqui (KAIRO_CRON_SECRET) la misma contrasena de solo letras sin acentos y numeros, y vuelve a desplegar."
            exit 1
          fi

          # --fail-with-body no se usa a propósito: queremos ver el cuerpo
          # de la respuesta TAMBIÉN cuando falla, porque ahí es donde Kairo
          # dice qué le falta (la migración, la clave de administrador...).
          codigo=$(curl -sS --max-time 120 \
            -o /tmp/respuesta.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SECRETO}" \
            -H "content-type: application/json" \
            "${KAIRO_URL}/api/coworks/ejecutar")

          echo "HTTP ${codigo}"
          cat /tmp/respuesta.json || true
          echo

          # Y si aun así responde una redirección, se dice qué significa.
          # A propósito NO se sigue: una redirección lleva la contraseña a
          # donde diga el servidor, y eso no se hace a ciegas.
          case "${codigo}" in
            30*)
              echo "::error::Kairo ha respondido ${codigo} (una redirección)."
              echo "::error::Revisa el secreto KAIRO_URL: tiene que ser el dominio de produccion de Vercel, tal cual."
              exit 1
              ;;
            401)
              # OJO: hay DOS 401 distintos y se parecen mucho.
              #
              # El de Vercel lo pone el portero de la calle: la web está
              # en modo privado (Settings → Deployment Protection) y solo
              # entra quien tenga sesión de Vercel. La llamada ni siquiera
              # llega a Kairo, así que la contraseña da igual: puedes
              # cambiarla veinte veces y seguirá saliendo 401.
              #
              # El de Kairo lo pone la puerta de casa, y ese sí es la
              # contraseña. Distinguirlos ahorra una tarde entera.
              if LC_ALL=C grep -qi 'vercel_auth\|Protected by Vercel\|Protected deployment' /tmp/respuesta.json; then
                echo "::error::Este 401 NO es de Kairo: lo pone Vercel delante, y la llamada no llega a la web."
                echo "::error::La web esta en modo privado: solo entra quien tenga sesion de Vercel, asi que nadie mas que tu puede usar Kairo."
                echo "::error::Vercel -> el proyecto -> Settings -> Deployment Protection -> Vercel Authentication -> apaga 'Require Log In' y guarda."
                echo "::error::La contrasena no tiene nada que ver con esto: no la toques."
              else
                echo "::error::Kairo ha respondido 401: la contrasena no coincide."
                echo "::error::KAIRO_CRON_SECRET (GitHub) y CRON_SECRET (Vercel) tienen que ser iguales."
                echo "::error::Y acuerdate de volver a desplegar Vercel despues de cambiar CRON_SECRET: hasta que no construya, el servidor sigue con la vieja."
              fi
              exit 1
              ;;
            200) ;;
            *)
              echo "::error::Kairo ha respondido ${codigo}"
              exit 1
              ;;
          esac
