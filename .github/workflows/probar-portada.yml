name: Probar la portada

# Comprueba que un desconocido puede usar Kairo sin cuenta.
#
# Esto no se puede probar desde donde se escribe el código: allí no hay
# claves de modelos y la salida a internet está capada. Aquí sí, y
# además se prueba contra la web desplegada, que es donde importa.
#
# Se lanza a mano desde la pestaña Actions.

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: La portada responde y trae la caja de probar
        run: |
          set -e
          PAGINA=$(curl -sS --max-time 30 "${{ secrets.KAIRO_URL }}/")
          echo "$PAGINA" | grep -q "Pru" && echo "ok · la portada carga"
          echo "$PAGINA" | grep -qi "sin cuenta" \
            && echo "ok · está la caja de probar" \
            || { echo "MAL · no aparece la caja de probar"; exit 1; }

      - name: Un desconocido pregunta y Kairo contesta
        run: |
          set -e
          R=$(curl -sS --max-time 60 -X POST "${{ secrets.KAIRO_URL }}/api/probar" \
                -H 'Content-Type: application/json' \
                -d '{"pregunta":"Contesta solo con la palabra FUNCIONA, sin nada mas."}')
          echo "Respuesta: $(echo "$R" | head -c 300)"
          echo "$R" | grep -q '"texto"' \
            && echo "ok · contesta sin cuenta" \
            || { echo "MAL · no ha contestado"; exit 1; }

      - name: Y a la cuarta dice que se acabó
        run: |
          set -e
          for i in 1 2 3 4; do
            C=$(curl -sS --max-time 60 -o /tmp/r.json -w '%{http_code}' \
                  -X POST "${{ secrets.KAIRO_URL }}/api/probar" \
                  -H 'Content-Type: application/json' \
                  -H "Cookie: kairo_probar=$i" \
                  -d '{"pregunta":"hola que tal"}')
            echo "con $i gastadas → $C"
            if [ "$i" -ge 3 ] && [ "$C" != "429" ]; then
              echo "MAL · con $i gastadas tendría que cortar"; exit 1
            fi
          done
          echo "ok · el tope por visitante funciona"
